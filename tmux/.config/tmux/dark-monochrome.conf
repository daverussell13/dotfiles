# Dark Monochrome tmux theme
# Colours mirror ~/.pi/agent/themes/dark-monochrome.json. The layout deliberately
# mirrors the previous Catppuccin basic window, pane, and status presentation.

# Status bar and connected application/session modules.
set -g status-style "bg=#121212,fg=#C0C0C0"
set -g status-left ""
set -g status-left-length 100
set -g status-right-length 100
set -g status-right "#[fg=#AF8F8F]#[fg=#080808,bg=#AF8F8F] #[fg=#C0C0C0,bg=#1A1A1A] #{pane_current_command}#[fg=#1A1A1A] #[fg=#{?client_prefix,#B07070,#80A680}]#[fg=#080808,bg=#{?client_prefix,#B07070,#80A680}] #[fg=#C0C0C0,bg=#1A1A1A] #S#[fg=#1A1A1A] "

# Catppuccin-like basic window blocks: inactive text + number, and an active
# block with a slightly brighter surface and a monochrome number badge.
setw -g window-status-format "#[fg=#C0C0C0,bg=#1A1A1A] #[fg=#C0C0C0,bg=#1A1A1A] #T #[fg=#080808,bg=#848484] #I "
# Active windows use the palette's strong border surface and maximum-emphasis
# text/badge so they remain distinct from inactive #1A1A1A windows.
setw -g window-status-current-format "#[fg=#FFFFFF,bg=#303030] #[fg=#FFFFFF,bg=#303030]#W#{?window_zoomed_flag, (),} #[fg=#080808,bg=#FFFFFF] #I "
setw -g window-status-activity-style "bg=#D0D0D0,fg=#080808"
setw -g window-status-bell-style "bg=#A9A477,fg=#080808"

# Pane status badges and borders.
set -g pane-border-style "fg=#3D3D3D"
set -g pane-active-border-style "#{?pane_in_mode,fg=#D0D0D0,#{?pane_synchronized,fg=#A6A6A6,fg=#D0D0D0}}"
set -g pane-border-format "#[fg=#80A680,bg=default]█#[fg=#1A1A1A,bg=#80A680]#{pane_index}#[fg=#80A680,bg=#1A1A1A]█ #[fg=#80A680,bg=#1A1A1A]#{b:pane_current_path}#[fg=#1A1A1A,bg=default]█"

# Modes, prompts, menus, and popups.
set -g mode-style "bg=#1A1A1A,bold"
set -g clock-mode-colour "#8096B0"
set -g message-style "fg=#80A6A6,bg=default,align=centre"
set -g message-command-style "fg=#80A6A6,bg=default,align=centre"
set -g menu-selected-style "fg=#1A1A1A,bg=#A9A477"
set -g popup-style "bg=#080808,fg=#C0C0C0"
set -g popup-border-style "fg=#222222"
