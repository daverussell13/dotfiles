source-file ~/.config/tmux/tmux.keys.conf
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
set -g prefix ^A
set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position bottom
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g mouse on
setw -g mode-keys vi
set -s extended-keys on
set -g extended-keys-format csi-u

# Standalone theme; it reproduces the previous Catppuccin layout without
# loading Catppuccin or depending on its variables.
source-file ~/.config/tmux/dark-monochrome.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

# set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Move tmux-thumbs off Space so prefix+Space stays next-layout
set -g @thumbs-key T

run '~/.tmux/plugins/tpm/tpm'

